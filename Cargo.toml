[package]
name = "seeusage"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A tiny native tray meter for Codex and MiniMax usage quotas"
license = "MIT"
readme = "README.md"
keywords = ["codex", "minimax", "usage", "tray", "quota"]
categories = ["command-line-utilities"]

[[bin]]
name = "SeeUsage"
path = "src/main.rs"

[dependencies]
auto-launch = "0.6.0"
chinese-lunisolar-calendar = { version = "=0.2.3", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
single-instance = "0.3.3"
tao = { version = "0.35.3", default-features = false }
tray-icon = { version = "0.24.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true

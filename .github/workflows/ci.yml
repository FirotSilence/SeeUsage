name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      - name: Verify third-party dependency inventory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/generate-third-party-inventory.ps1
          git diff --exit-code -- THIRD_PARTY_DEPENDENCIES.md

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - name: Verify the ignored GTK advisory stays outside supported targets
        shell: bash
        run: |
          test -z "$(cargo tree --locked --target x86_64-pc-windows-msvc -i glib 2>/dev/null)"
          test -z "$(cargo tree --locked --target aarch64-apple-darwin -i glib 2>/dev/null)"
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit locked dependencies
        # glib is pulled only by Linux GTK dependencies; SeeUsage supports Windows and macOS.
        run: cargo audit --file Cargo.lock --ignore RUSTSEC-2024-0429
